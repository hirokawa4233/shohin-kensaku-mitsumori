<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>商品検索・見積依頼</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  color: #163e76;
  background: #fff;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

/* ヘッダー */
.top {
  height: 64px;
  background: #07366f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.brand {
  font-size: 24px;
  font-weight: 700;
}

.quote-btn {
  border: 1px solid #fff;
  background: transparent;
  color: #fff;
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 700;
}

/* 検索エリア */
.search-box {
  max-width: 1100px;
  margin: 35px auto 0;
  padding: 38px 45px 30px;
  background: #07366f;
  color: #fff;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

.search-box h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

.search-box p {
  margin: 7px 0;
  font-weight: 600;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}

.search-row input {
  flex: 1;
  height: 58px;
  border: 0;
  border-radius: 9px;
  padding: 0 18px;
  font-size: 17px;
}

.search-row button {
  width: 120px;
  border: 1px solid #fff;
  border-radius: 9px;
  background: #07366f;
  color: #fff;
  font-weight: 700;
  font-size: 17px;
}

.example {
  margin-top: 15px;
}

/* 商品一覧 */
.container {
  max-width: 1100px;
  margin: 32px auto;
  padding: 0 10px;
}

.list-title {
  font-size: 23px;
  font-weight: 700;
  margin-bottom: 3px;
}

.count {
  margin-bottom: 14px;
  color: #56739e;
}

.card {
  border: 1.5px solid #7c96bd;
  border-radius: 18px;
  padding: 18px 20px;
  margin: 14px 0;
  background: #fff;
}

.grid {
  display: grid;
  grid-template-columns: 1.1fr 1.3fr 1.2fr;
  gap: 8px 22px;
}

.code {
  font-size: 14px;
}

.size {
  font-size: 18px;
  font-weight: 700;
  color: #0c315e;
}

.label {
  font-size: 12px;
  color: #6683ad;
  margin-right: 8px;
}

.bottom {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.price-area {
  display: flex;
  align-items: center;
  gap: 28px;
}

.value {
  font-size: 14px;
}

.price strong {
  font-size: 20px;
  color: #102f5d;
}

.qty {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty input {
  width: 70px;
  height: 42px;
  border: 1px solid #b7c9df;
  border-radius: 10px;
  text-align: center;
}

.add {
  border: 0;
  border-radius: 12px;
  background: #f6b18c;
  padding: 13px 24px;
  font-weight: 700;
}

.add:hover {
  opacity: .85;
}

/* 初期表示 */
.hint {
  text-align: center;
  margin: 100px auto;
}

.hint-icon {
  font-size: 48px;
  color: #c5ccd8;
}

.hint h2 {
  font-size: 20px;
}

.empty {
  text-align: center;
  padding: 60px 20px;
  color: #667a99;
}

/* トースト */
.toast {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #07366f;
  color: #fff;
  padding: 14px 25px;
  border-radius: 30px;
  z-index: 9999;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 5000;
  padding: 30px;
}

.modal.open {
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: min(800px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #fff;
  border-radius: 18px;
  padding: 25px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  margin: 0;
}

.close {
  border: 0;
  background: transparent;
  font-size: 28px;
}

.quote-item {
  border: 1px solid #c4d2e5;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
  display: flex;
  justify-content: space-between;
  gap: 20px;
}

.secondary {
  border: 1px solid #9db2ce;
  background: #fff;
  border-radius: 8px;
  padding: 5px 12px;
}

.form-area {
  display: none;
  margin-top: 25px;
  border-top: 1px solid #d7e0eb;
  padding-top: 20px;
}

.form-group {
  margin: 12px 0;
}

.form-group label {
  display: block;
  font-weight: 700;
  margin-bottom: 5px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  border: 1px solid #b7c9df;
  border-radius: 8px;
  padding: 10px;
}

.form-group textarea {
  min-height: 90px;
}

.primary {
  border: 0;
  background: #07366f;
  color: #fff;
  border-radius: 10px;
  padding: 13px 25px;
  font-weight: 700;
}

@media (max-width: 700px) {
  .search-box {
    margin: 15px;
    padding: 25px 18px;
  }

  .search-row {
    flex-direction: column;
  }

  .search-row button {
    width: 100%;
    height: 50px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .bottom {
    flex-direction: column;
    align-items: stretch;
    gap: 15px;
  }

  .price-area {
    flex-wrap: wrap;
    gap: 15px;
  }

  .add {
    width: 100%;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">🛒 商品検索</div>

  <button class="quote-btn" onclick="openQuote()">
    🛒 見積を見る (<span id="qcount">0</span>)
  </button>
</header>


<main>

<section class="search-box">

  <h1>商品を検索してください</h1>

  <p>品番・サイズ・ブランド・パターンなどから検索できます</p>
  <p>※送料別途ご連絡</p>

  <div class="search-row">

    <input
      id="search"
      type="text"
      placeholder="品番・サイズ・ブランドなどを入力"
      autocomplete="off"
    >

    <button type="button" onclick="doSearch()">
      🔍 検索
    </button>

  </div>

  <div class="example">
    【例】155/65R14 → 1556514
  </div>

</section>


<section class="container">

  <div class="list-title">商品一覧</div>

  <div id="count" class="count">検索してください</div>

  <div id="hint" class="hint">
    <div class="hint-icon">⌕</div>
    <h2>商品を検索してください</h2>
    <p>
      上の検索ボックスにキーワードを入力すると、<br>
      商品一覧が表示されます。
    </p>
  </div>

  <div id="results" style="display:none;">
    <div id="list"></div>
  </div>

</section>

</main>


<!-- 見積モーダル -->

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>見積内容</h2>

      <button class="close" onclick="closeQuote()">
        ×
      </button>
    </div>

    <div id="quoteList"></div>


    <div id="formArea" class="form-area">

      <h3>見積依頼者情報</h3>

      <div class="form-group">
        <label for="company">会社名</label>
        <input id="company" type="text">
      </div>

      <div class="form-group">
        <label for="phone">電話番号</label>
        <input id="phone" type="text">
      </div>

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input id="email" type="email">
      </div>

      <div class="form-group">
        <label for="note">備考</label>
        <textarea id="note"></textarea>
      </div>

      <button
        type="button"
        class="primary"
        onclick="submitQuote()"
      >
        見積依頼を送信
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   商品データ
   ========================= */

const products = [

  {
    code: "15338964",
    size: "225/45R21",
    a: 61700,
    price: 25040,
    brand: "FINESSA",
    pattern: "HB01"
  },

  {
    code: "15314920",
    size: "225/65R17",
    a: 31300,
    price: 25040,
    brand: "ALENZA",
    pattern: "001"
  },

  {
    code: "13539662",
    size: "205/80R16 115/113",
    a: 31300,
    price: 25040,
    brand: "ECOPIA",
    pattern: "R207"
  }

];


/* =========================
   見積データ
   ========================= */

let quotes = [];


/* =========================
   短縮関数
   ========================= */

function $(id) {
  return document.getElementById(id);
}


/* =========================
   検索用文字変換
   ========================= */

function norm(value) {

  return String(value ?? "")
    .toLowerCase()
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
      return String.fromCharCode(s.charCodeAt(0) - 0xfee0);
    })
    .replace(/[‐-‒–—―ー]/g, "-")
    .replace(/\s+/g, "");

}


function digits(value) {

  return String(value ?? "")
    .replace(/\D/g, "");

}


/* =========================
   数字表示
   ========================= */

function fmt(value) {

  if (typeof value === "number") {
    return value.toLocaleString("ja-JP");
  }

  const n = Number(value);

  if (!Number.isNaN(n)) {
    return n.toLocaleString("ja-JP");
  }

  return String(value ?? "");

}


/* =========================
   HTMLエスケープ
   ========================= */

function esc(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      }[m];

    }
  );

}


/* =========================
   商品検索
   ========================= */

function doSearch() {

  const q = $("search").value.trim();

  /* 空欄 */
  if (!q) {

    $("hint").style.display = "block";
    $("results").style.display = "none";
    $("count").textContent = "検索してください";

    return;

  }


  const nq = norm(q);
  const nd = digits(q);


  const hit = products
    .filter(function(p) {

      const normalMatch = [
        p.code,
        p.size,
        p.a,
        p.price,
        p.brand,
        p.pattern

      ].some(function(v) {

        return norm(v).includes(nq);

      });


      const digitMatch =
        nd.length > 0 &&
        digits(p.size).includes(nd);


      return normalMatch || digitMatch;

    })
    .slice(0, 100);


  $("hint").style.display = "none";
  $("results").style.display = "block";

  $("count").textContent =
    hit.length + "件表示";


  $("list").innerHTML = hit.length

    ? hit.map(function(p, i) {

        return `
          <article class="card">

            <div class="grid">

              <div>
                <div class="code">
                  ${esc(p.code)}
                </div>

                <div class="size">
                  ${esc(p.size)}
                </div>
              </div>


              <div>
                <span class="label">
                  ブランド
                </span>

                ${esc(p.brand)}
              </div>


              <div>
                <span class="label">
                  パターン
                </span>

                ${esc(p.pattern)}
              </div>

            </div>


            <div class="bottom">

              <div class="price-area">

                <div class="value">
                  A表：${fmt(p.a)}
                </div>


                <div class="price">

                  <span class="label">
                    価格
                  </span>

                  <strong>
                    ${fmt(p.price)}
                  </strong>

                </div>


                <div class="qty">

                  <span>
                    数量
                  </span>

                  <input
                    id="qty-${i}"
                    type="number"
                    min="1"
                    value="1"
                  >

                </div>

              </div>


              <button
                type="button"
                class="add"
                onclick='addQuote(${JSON.stringify(p)}, ${i})'
              >
                見積に追加
              </button>

            </div>

          </article>
        `;

      }).join("")


    : `
      <div class="empty">
        該当する商品が見つかりませんでした。
      </div>
    `;

}


/* =========================
   見積に追加
   ========================= */

function addQuote(p, i) {

  const input = $("qty-" + i);

  const q = Math.max(
    1,
    parseInt(input.value) || 1
  );


  const ex = quotes.find(function(x) {

    return (
      x.code === p.code &&
      x.size === p.size &&
      x.brand === p.brand &&
      x.pattern === p.pattern
    );

  });


  if (ex) {

    ex.qty += q;

  } else {

    quotes.push({
      ...p,
      qty: q
    });

  }


  $("qcount").textContent =
    quotes.length;


  toast("見積に追加しました");

}


/* =========================
   見積を開く
   ========================= */

function openQuote() {

  $("modal").classList.add("open");

  renderQuote();

}


/* =========================
   見積を閉じる
   ========================= */

function closeQuote() {

  $("modal").classList.remove("open");

}


/* =========================
   見積内容表示
   ========================= */

function renderQuote() {

  if (!quotes.length) {

    $("quoteList").innerHTML = `
      <div class="empty">

        見積内容はまだありません

        <br>

        <small>
          商品を検索して、見積に追加してください。
        </small>

      </div>
    `;

    $("formArea").style.display = "none";

    return;

  }


  $("quoteList").innerHTML = quotes.map(function(p, i) {

    const total =
      (Number(p.price) || 0) * p.qty;


    return `
      <div class="quote-item">

        <div>

          <b>
            ${esc(p.code)}
          </b>

          <br>

          ${esc(p.brand)}
          ${esc(p.pattern)}

          <br>

          ${esc(p.size)}

        </div>


        <div>

          数量 ${p.qty}

          <br>

          ${fmt(total)}円

          <br>

          <button
            type="button"
            class="secondary"
            onclick="removeQuote(${i})"
          >
            削除
          </button>

        </div>

      </div>
    `;

  }).join("");


  $("formArea").style.display = "block";

}


/* =========================
   見積から削除
   ========================= */

function removeQuote(i) {

  quotes.splice(i, 1);

  $("qcount").textContent =
    quotes.length;

  renderQuote();

}


/* =========================
   見積送信
   ========================= */

async function submitQuote() {

  const form =
    document.querySelector("#formArea");


  const inputs =
    form.querySelectorAll("input, textarea");


  const data = {};


  inputs.forEach(function(input) {

    if (input.id) {

      data[input.id] =
        input.value.trim();

    }

  });


  try {

    const response =
      await fetch("/api/estimate", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          company: data.company || "",
          phone: data.phone || "",
          email: data.email || "",
          note: data.note || "",
          items: quotes

        })

      });


    const result =
      await response.json();


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "送信に失敗しました"
      );

    }


    toast(
      "見積依頼を受け付けました"
    );


    setTimeout(function() {

      closeQuote();

    }, 700);


  } catch (error) {

    console.error(error);

    toast(
      "見積依頼の送信に失敗しました"
    );

  }

}


/* =========================
   メッセージ表示
   ========================= */

function toast(t) {

  $("toast").textContent = t;

  $("toast").style.display =
    "block";


  setTimeout(function() {

    $("toast").style.display =
      "none";

  }, 1800);

}


/* =========================
   Enterキーでも検索
   ========================= */

$("search").addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Enter") {

      e.preventDefault();

      doSearch();

    }

  }
);


/* =========================
   モーダル外クリック
   ========================= */

$("modal").addEventListener(
  "click",
  function(e) {

    if (e.target === $("modal")) {

      closeQuote();

    }

  }
);

</script>

</body>
</html>
