<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品検索・見積依頼</title>

<style>
:root{
  --navy:#0d3b78;
  --navy2:#123f7c;
  --text:#163e76;
  --line:#7c96bd;
  --orange:#f5b18d;
  --white:#fff;
  --bg:#fff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,
input,
textarea{
  font:inherit;
}


/* ==========================
   ヘッダー
========================== */

.top{
  height:80px;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 36px;
}

.brand{
  font-size:24px;
  font-weight:800;
}

.quote-btn{
  background:transparent;
  color:white;
  border:1px solid white;
  border-radius:10px;
  padding:12px 22px;
  cursor:pointer;
  font-weight:700;
}

.quote-btn:hover{
  background:rgba(255,255,255,.1);
}


/* ==========================
   検索エリア
========================== */

.search-box{
  width:min(1100px,92%);
  margin:18px auto 0;
  background:var(--navy);
  border-radius:18px;
  padding:40px 60px 30px;
  text-align:center;
  color:white;
  box-shadow:0 8px 24px rgba(0,0,0,.10);
}

.search-box h1{
  margin:0 0 12px;
  font-size:34px;
}

.search-box p{
  margin:6px 0;
  font-weight:600;
}

.search-row{
  display:flex;
  gap:8px;
  margin-top:28px;
}

.search-row input{
  flex:1;
  height:58px;
  border:0;
  border-radius:9px;
  padding:0 18px;
  font-size:18px;
  outline:none;
}

.search-row button{
  width:120px;
  border:1px solid white;
  background:var(--navy);
  color:white;
  border-radius:9px;
  font-weight:800;
  cursor:pointer;
}

.search-row button:hover{
  background:#174b91;
}

.example{
  margin-top:18px;
  font-size:15px;
}


/* ==========================
   商品一覧
========================== */

.container{
  width:min(1100px,92%);
  margin:32px auto 80px;
}

.list-header{
  margin-bottom:12px;
}

.list-header h2{
  margin:0;
  font-size:24px;
}

#count{
  margin-top:4px;
  color:#6d8ab5;
}

.hint{
  text-align:center;
  padding:100px 20px;
  color:#6c86ad;
}

.hint .icon{
  font-size:55px;
  margin-bottom:12px;
}

.hint h3{
  color:#163e76;
  font-size:22px;
}

.error{
  text-align:center;
  background:#fff0f0;
  border:1px solid #e5aaaa;
  color:#a33;
  padding:20px;
  border-radius:12px;
}


/* ==========================
   商品カード
========================== */

.card{
  border:1.5px solid var(--line);
  border-radius:18px;
  padding:18px 20px;
  margin:14px 0;
  background:white;
}

.grid{
  display:grid;
  grid-template-columns:1.1fr 1.3fr 1.2fr;
  gap:8px 22px;
  align-items:start;
}

.code{
  font-size:14px;
  color:#163e76;
}

.size{
  font-size:18px;
  font-weight:800;
  margin-top:3px;
  color:#142f55;
}

.label{
  color:#7893bb;
  font-size:12px;
  margin-right:7px;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  gap:20px;
}

.price-area{
  display:flex;
  align-items:center;
  gap:28px;
  flex-wrap:wrap;
}

.value{
  font-size:14px;
}

.price{
  display:flex;
  align-items:center;
  gap:6px;
}

.price strong{
  font-size:21px;
  color:#142f55;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty input{
  width:70px;
  height:42px;
  border:1px solid #c5d2e4;
  border-radius:10px;
  padding:0 10px;
  text-align:center;
}

.add{
  border:1px solid #e99a6d;
  background:var(--orange);
  color:#111;
  border-radius:12px;
  padding:12px 28px;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.add:hover{
  filter:brightness(.96);
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#6c86ad;
}


/* ==========================
   モーダル
========================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:18px;
  padding:28px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:transparent;
  font-size:28px;
  cursor:pointer;
}

.quote-item{
  border:1px solid #c5d2e4;
  border-radius:12px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:10px;
}

.quote-item button{
  margin-top:7px;
}

.secondary{
  border:1px solid #b8c7db;
  background:white;
  border-radius:8px;
  padding:5px 10px;
  cursor:pointer;
}

.form-area{
  display:none;
  margin-top:24px;
  border-top:1px solid #d4deeb;
  padding-top:22px;
}

.form-area h3{
  margin-top:0;
}

.form-row{
  margin-bottom:14px;
}

.form-row label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:700;
}

.form-row input,
.form-row textarea{
  width:100%;
  border:1px solid #c5d2e4;
  border-radius:9px;
  padding:10px;
}

.form-row textarea{
  min-height:90px;
  resize:vertical;
}

.primary{
  border:0;
  background:var(--navy);
  color:white;
  border-radius:10px;
  padding:12px 24px;
  cursor:pointer;
  font-weight:800;
}

.primary:hover{
  background:#174b91;
}


/* ==========================
   トースト
========================== */

.toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  background:var(--navy);
  color:white;
  padding:14px 24px;
  border-radius:30px;
  display:none;
  z-index:2000;
  font-weight:700;
}


/* ==========================
   レスポンシブ
========================== */

@media(max-width:700px){

  .top{
    padding:0 14px;
  }

  .brand{
    font-size:19px;
  }

  .quote-btn{
    padding:9px 12px;
    font-size:13px;
  }

  .search-box{
    padding:28px 18px 24px;
  }

  .search-box h1{
    font-size:27px;
  }

  .search-row{
    flex-direction:column;
  }

  .search-row button{
    width:100%;
    height:52px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .bottom{
    flex-direction:column;
    align-items:stretch;
  }

  .add{
    width:100%;
  }

  .price-area{
    gap:12px;
  }
}
</style>
</head>


<body>

<header class="top">
  <div class="brand">🛒 商品検索</div>

  <button class="quote-btn" onclick="openQuote()">
    🛒 見積を見る (<span id="qcount">0</span>)
  </button>
</header>


<main>

<section class="search-box">

  <h1>商品を検索してください</h1>

  <p>品番・サイズ・ブランド・パターンなどから検索できます</p>
  <p style="font-size:13px;">※送料別途ご連絡</p>

  <div class="search-row">
    <input
      id="search"
      type="text"
      placeholder="品番・サイズ・ブランドなどを入力"
      autocomplete="off"
    >

    <button onclick="doSearch()">
      🔍 検索
    </button>
  </div>

  <div class="example">
    【例】155/65R14 → 1556514
  </div>

</section>


<section class="container">

  <div class="list-header">
    <h2>商品一覧</h2>
    <div id="count"></div>
  </div>

  <div id="hint" class="hint">
    <div class="icon">🔍</div>
    <h3>商品を検索してください</h3>
    <div>
      上の検索ボックスにキーワードを入力すると、<br>
      商品一覧が表示されます。
    </div>
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <div id="results" style="display:none;">
    <div id="list"></div>
  </div>

</section>

</main>


<!-- ==========================
     見積モーダル
========================== -->

<div id="modal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>見積内容</h2>

      <button class="close" onclick="closeQuote()">
        ×
      </button>
    </div>

    <div id="quoteList"></div>

    <div id="formArea" class="form-area">

      <h3>見積依頼情報</h3>

      <div class="form-row">
        <label for="company">会社名</label>
        <input id="company" type="text">
      </div>

      <div class="form-row">
        <label for="phone">電話番号</label>
        <input id="phone" type="text">
      </div>

      <div class="form-row">
        <label for="email">メールアドレス</label>
        <input id="email" type="email">
      </div>

      <div class="form-row">
        <label for="note">備考</label>
        <textarea id="note"></textarea>
      </div>

      <button class="primary" onclick="submitQuote()">
        見積依頼を送信
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

// ==============================
// 商品データ
// ==============================

let products = [];

let quotes = [];


// ==============================
// 共通関数
// ==============================

function $(id){
  return document.getElementById(id);
}


function norm(value){

  return String(value ?? "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/\s+/g, "");

}


function digits(value){

  return String(value ?? "")
    .normalize("NFKC")
    .replace(/\D/g, "");

}


function fmt(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "";
  }

  if(typeof value === "number"){
    return value.toLocaleString("ja-JP");
  }

  const text = String(value);

  const num = Number(text.replace(/,/g,""));

  if(!Number.isNaN(num) && text.trim() !== ""){
    return num.toLocaleString("ja-JP");
  }

  return text;
}


function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[m];

    });

}


// ==============================
// 商品データ読み込み
// ==============================

async function loadProducts(){

  try{

    const response = await fetch("/api/products", {
      cache:"no-store"
    });

    const data = await response.json();

    if(!response.ok || !data.success){

      throw new Error(
        data.message || "商品データの取得に失敗しました"
      );

    }

    products = Array.isArray(data.products)
      ? data.products
      : [];

    console.log(
      "Excelから商品データを読み込みました:",
      products.length,
      "件"
    );

  }catch(error){

    console.error(error);

    $("error").style.display = "block";

    $("error").textContent =
      "商品データを読み込めませんでした。"
      + "\n"
      + error.message;

  }

}


// ==============================
// 商品検索
// ==============================

function doSearch(){

  const q = $("search").value.trim();

  if(!q){

    $("hint").style.display = "block";
    $("results").style.display = "none";
    $("count").textContent = "";

    return;

  }


  const nq = norm(q);
  const nd = digits(q);


  const hit = products
    .filter(function(p){

      const values = [
        p.code,
        p.size,
        p.a,
        p.price,
        p.brand,
        p.pattern
      ];


      // 通常検索
      const normalHit = values.some(function(v){

        return norm(v).includes(nq);

      });


      // サイズ等を数字だけで検索
      const digitHit =
        nd.length > 0 &&
        values.some(function(v){

          const d = digits(v);

          return d.length > 0 && d.includes(nd);

        });


      return normalHit || digitHit;

    })
    .slice(0, 100);


  $("hint").style.display = "none";
  $("results").style.display = "block";

  $("count").textContent =
    `${hit.length}件表示`;


  if(!hit.length){

    $("list").innerHTML =
      `<div class="empty">
        該当する商品が見つかりませんでした。
      </div>`;

    return;

  }


  $("list").innerHTML = hit.map(function(p,index){

    return `
      <article class="card">

        <div class="grid">

          <div>
            <div class="code">
              ${esc(p.code)}
            </div>

            <div class="size">
              ${esc(p.size)}
            </div>
          </div>


          <div>
            <span class="label">
              ブランド
            </span>

            ${esc(p.brand)}
          </div>


          <div>
            <span class="label">
              パターン
            </span>

            ${esc(p.pattern)}
          </div>

        </div>


        <div class="bottom">

          <div class="price-area">

            <div class="value">
              A表：${fmt(p.a)}
            </div>


            <div class="price">

              <span class="label">
                価格
              </span>

              <strong>
                ${fmt(p.price)}
              </strong>

            </div>


            <div class="qty">

              <span>
                数量
              </span>

              <input
                id="qty-${index}"
                type="number"
                min="1"
                value="1"
              >

            </div>

          </div>


          <button
            class="add"
            onclick='addQuote(${JSON.stringify(p)},${index})'
          >
            見積に追加
          </button>

        </div>

      </article>
    `;

  }).join("");

}


// ==============================
// 見積追加
// ==============================

function addQuote(p,index){

  const input = $(`qty-${index}`);

  const q = Math.max(
    1,
    parseInt(input.value) || 1
  );


  const existing = quotes.find(function(x){

    return (
      String(x.code) === String(p.code) &&
      String(x.size) === String(p.size) &&
      String(x.brand) === String(p.brand) &&
      String(x.pattern) === String(p.pattern)
    );

  });


  if(existing){

    existing.qty += q;

  }else{

    quotes.push({
      ...p,
      qty:q
    });

  }


  $("qcount").textContent =
    quotes.length;


  toast("見積に追加しました");

}


// ==============================
// 見積表示
// ==============================

function openQuote(){

  $("modal").classList.add("open");

  renderQuote();

}


function closeQuote(){

  $("modal").classList.remove("open");

}


function renderQuote(){

  if(!quotes.length){

    $("quoteList").innerHTML = `
      <div class="empty">
        見積内容はまだありません<br>
        <small>
          商品を検索して、見積に追加してください。
        </small>
      </div>
    `;

    $("formArea").style.display = "none";

    return;

  }


  $("quoteList").innerHTML =
    quotes.map(function(p,index){

      const total =
        (Number(p.price) || 0) * p.qty;


      return `
        <div class="quote-item">

          <div>

            <b>
              ${esc(p.code)}
            </b>

            <br>

            ${esc(p.brand)}
            ${esc(p.pattern)}

            <br>

            ${esc(p.size)}

          </div>


          <div>

            数量 ${p.qty}

            <br>

            ${fmt(total)}円

            <br>

            <button
              class="secondary"
              onclick="removeQuote(${index})"
            >
              削除
            </button>

          </div>

        </div>
      `;

    }).join("");


  $("formArea").style.display = "block";

}


// ==============================
// 見積削除
// ==============================

function removeQuote(index){

  quotes.splice(index,1);

  $("qcount").textContent =
    quotes.length;

  renderQuote();

}


// ==============================
// 見積送信
// ==============================

async function submitQuote(){

  if(!quotes.length){

    return;

  }


  const form = $("formArea");

  const inputs =
    form.querySelectorAll("input, textarea");


  const data = {};


  inputs.forEach(function(input){

    if(input.id){

      data[input.id] =
        input.value.trim();

    }

  });


  try{

    const response =
      await fetch("/api/estimate", {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          company:data.company || "",
          phone:data.phone || "",
          email:data.email || "",
          note:data.note || "",

          items:quotes

        })

      });


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.message ||
        "送信に失敗しました"
      );

    }


    toast(
      "見積依頼を受け付けました"
    );


    setTimeout(function(){

      quotes = [];

      $("qcount").textContent = "0";

      closeQuote();

    },700);


  }catch(error){

    console.error(error);

    toast(
      "見積依頼の送信に失敗しました"
    );

  }

}


// ==============================
// トースト
// ==============================

function toast(text){

  $("toast").textContent = text;

  $("toast").style.display = "block";


  setTimeout(function(){

    $("toast").style.display = "none";

  },1800);

}


// ==============================
// Enterで検索
// ==============================

$("search").addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      doSearch();

    }

  }
);


// ==============================
// 起動時にExcel商品データ取得
// ==============================

loadProducts();

</script>

</body>
</html>
