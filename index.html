, {       method: 'POST',       headers: {         'Content-Type': 'application/json'       },       body: JSON.stringify({         company: data.company || '',         phone: data.phone || '',         email: data.email || '',         note: data.note || '',         items: quotes       })     });      const result = await response.json();      if(!response.ok || !result.success){       throw new Error(result.message || '送信に失敗しました');     }      toast('見積依頼を受け付けました');     setTimeout(() => {       closeQuote();     }, 700);    }catch(error){     console.error(error);     toast('見積依頼の送信に失敗しました');   } }{toast('見積依頼を受け付けました（試作）');setTimeout(()=>{closeQuote()},700)}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSearch()}});</script></body></html>
