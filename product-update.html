<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品データ更新</title>

<style>

body {
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;

  margin: 0;
  padding: 24px;

  background: #f5f7f8;
  color: #222;
}

h1 {
  margin: 0 0 8px;
}

.description {
  color: #666;
  margin-bottom: 20px;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

button {
  border: none;
  border-radius: 6px;
  padding: 9px 16px;
  cursor: pointer;
  font-size: 14px;
}

.reload-button {
  background: #1976d2;
  color: white;
}

.add-button {
  background: #2e8b57;
  color: white;
}

.save-button {
  background: #e67e22;
  color: white;
}

.message {
  margin-bottom: 16px;
  padding: 10px 14px;
  background: white;
  border-radius: 6px;
  border: 1px solid #ddd;
}

.table-wrap {
  overflow-x: auto;
  background: white;
  border-radius: 8px;
  border: 1px solid #ddd;
}

table {
  border-collapse: collapse;
  width: 100%;
  min-width: 1150px;
}

th,
td {
  border-bottom: 1px solid #ddd;
  padding: 8px;
  text-align: left;
  white-space: nowrap;
}

th {
  background: #eef1f3;
  position: sticky;
  top: 0;
  z-index: 2;
}

td input[type="text"],
td input[type="number"] {
  width: 100%;
  box-sizing: border-box;
  padding: 7px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

/* ==============================
   ブランド画像
   ============================== */

.brand-image-cell {
  width: 150px;
  text-align: center;
  white-space: normal;
}

.brand-image-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.brand-image-preview {
  width: 90px;
  height: 70px;
  object-fit: contain;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fafafa;
  display: block;
}

.brand-image-empty {
  width: 90px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #bbb;
  border-radius: 6px;
  background: #fafafa;
  color: #999;
  font-size: 12px;
}

.image-select-button {
  background: #607d8b;
  color: white;
  padding: 6px 10px;
  font-size: 12px;
}

.image-file-input {
  display: none;
}

.actions {
  text-align: center;
}

.delete-button {
  background: #d9534f;
  color: white;
}

.empty {
  padding: 30px;
  text-align: center;
  color: #777;
}

.loading {
  padding: 30px;
  text-align: center;
}

</style>
</head>


<body>

<h1>商品データ更新</h1>

<div class="description">
  価格表.xlsm の Sheet2 に登録されている商品を確認・編集します。
</div>


<div class="toolbar">

  <button
    class="reload-button"
    onclick="loadProducts()"
  >
    商品データを再読み込み
  </button>

  <button
    class="add-button"
    onclick="addProduct()"
  >
    ＋ 商品を追加
  </button>

  <button
    class="save-button"
    onclick="saveProducts()"
  >
    商品データを保存
  </button>

</div>


<div
  id="message"
  class="message"
>
  商品データを読み込んでいます…… 
</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>品番</th>
<th>サイズ</th>
<th>A表</th>
<th>価格</th>
<th>ブランド</th>
<th>ブランド写真</th>
<th>パターン</th>
<th>操作</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>


<script>

let products = [];


/*
  ブランド画像

  brandImages:
  {
    "REGNO": "data:image/jpeg;base64,...",
    "POTENZA": "data:image/jpeg;base64,..."
  }
*/
let brandImages = {};


/*
  今回の操作で変更されたブランド画像
*/
let changedBrandImages = new Set();


// ==============================
// メッセージ
// ==============================

function showMessage(text) {

  document.getElementById(
    "message"
  ).textContent = text;

}


// ==============================
// ブランド画像読み込み
// ==============================

async function loadBrandImages() {

  try {

    const response =
      await fetch(
        "/api/brand-images"
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        "ブランド画像の取得に失敗しました"
      );

    }

    brandImages = {};

    const rows =
      Array.isArray(
        data.brandImages
      )
        ? data.brandImages
        : [];


    rows.forEach((item) => {

      const brand =
        String(
          item.brand ?? ""
        ).trim();

      const imageData =
        String(
          item.imageData ?? ""
        ).trim();


      if (
        brand &&
        imageData
      ) {

        brandImages[brand] =
          imageData;

      }

    });


  } catch (error) {

    console.error(
      "ブランド画像読み込みエラー:",
      error
    );

  }

}


// ==============================
// 商品データ読み込み
// ==============================

async function loadProducts() {

  const table =
    document.getElementById(
      "productTable"
    );

  table.innerHTML =
    `<tr>
      <td
        colspan="8"
        class="loading"
      >
        読み込み中……
      </td>
    </tr>`;


  try {

    /*
      商品データとブランド画像を
      同時に読み込む
    */

    await loadBrandImages();


    const response =
      await fetch(
        "/api/products"
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "商品データの取得に失敗しました"
      );

    }


    products =
      Array.isArray(
        data.products
      )
        ? data.products
        : [];


    changedBrandImages.clear();


    renderProducts();


    showMessage(
      `${products.length} 件の商品を読み込みました。`
    );


  } catch (error) {

    console.error(error);


    table.innerHTML =
      `<tr>
        <td
          colspan="8"
          class="empty"
        >
          商品データを読み込めませんでした。
        </td>
      </tr>`;


    showMessage(
      "エラー：" +
      error.message
    );

  }

}


// ==============================
// 商品一覧表示
// ==============================

function renderProducts() {

  const table =
    document.getElementById(
      "productTable"
    );


  table.innerHTML = "";


  if (
    products.length === 0
  ) {

    table.innerHTML =
      `<tr>
        <td
          colspan="8"
          class="empty"
        >
          商品データがありません。
        </td>
      </tr>`;

    return;

  }


  products.forEach(
    (product, index) => {

      const row =
        document.createElement(
          "tr"
        );


      const brand =
        String(
          product.brand ?? ""
        ).trim();


      const imageData =
        brandImages[brand] || "";


      let imageHtml = "";


      if (imageData) {

        imageHtml = `
          <img
            class="brand-image-preview"
            src="${escapeHtml(imageData)}"
            alt="${escapeHtml(brand)}"
          >
        `;

      } else {

        imageHtml = `
          <div class="brand-image-empty">
            写真なし
          </div>
        `;

      }


      row.innerHTML = `

        <td>
          <input
            type="text"
            value="${escapeHtml(product.code ?? "")}"
            onchange="updateProduct(${index}, 'code', this.value)"
          >
        </td>


        <td>
          <input
            type="text"
            value="${escapeHtml(product.size ?? "")}"
            onchange="updateProduct(${index}, 'size', this.value)"
          >
        </td>


        <td>
          <input
            type="text"
            value="${escapeHtml(product.a ?? "")}"
            onchange="updateProduct(${index}, 'a', this.value)"
          >
        </td>


        <td>
          <input
            type="number"
            value="${escapeHtml(product.price ?? "")}"
            onchange="updateProduct(${index}, 'price', this.value)"
          >
        </td>


        <td>
          <input
            type="text"
            value="${escapeHtml(product.brand ?? "")}"
            onchange="updateProduct(${index}, 'brand', this.value)"
          >
        </td>


        <td class="brand-image-cell">

          <div class="brand-image-box">

            ${imageHtml}

            <button
              type="button"
              class="image-select-button"
              onclick="selectBrandImage(${index})"
            >
              写真を選択
            </button>

            <input
              type="file"
              accept="image/*"
              class="image-file-input"
              id="brandImage_${index}"
              onchange="handleBrandImage(${index}, this.files[0])"
            >

          </div>

        </td>


        <td>
          <input
            type="text"
            value="${escapeHtml(product.pattern ?? "")}"
            onchange="updateProduct(${index}, 'pattern', this.value)"
          >
        </td>


        <td class="actions">

          <button
            class="delete-button"
            onclick="deleteProduct(${index})"
          >
            削除
          </button>

        </td>

      `;


      table.appendChild(row);

    }
  );

}


// ==============================
// 商品データ変更
// ==============================

function updateProduct(
  index,
  key,
  value
) {

  products[index][key] =
    value;


  /*
    ブランド名を変更した場合、
    表示を更新する
  */

  if (
    key === "brand"
  ) {

    renderProducts();

  }

}


// ==============================
// 写真選択
// ==============================

function selectBrandImage(index) {

  const input =
    document.getElementById(
      `brandImage_${index}`
    );


  if (input) {

    input.click();

  }

}


// ==============================
// ブランド写真選択後
// ==============================

function handleBrandImage(
  index,
  file
) {

  if (!file) {

    return;

  }


  const brand =
    String(
      products[index]?.brand ?? ""
    ).trim();


  if (!brand) {

    alert(
      "先にブランド名を入力してください。"
    );

    return;

  }


  if (
    !file.type.startsWith("image/")
  ) {

    alert(
      "画像ファイルを選択してください。"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload = function(event) {

    const imageData =
      event.target.result;


    if (!imageData) {

      alert(
        "画像の読み込みに失敗しました。"
      );

      return;

    }


    /*
      大きな画像をそのままDBへ送らず、
      ブラウザ側で縮小・圧縮する
    */

    resizeImage(
      imageData,
      800,
      0.8
    )
      .then((compressedImage) => {

        brandImages[brand] =
          compressedImage;


        changedBrandImages.add(
          brand
        );


        renderProducts();


        showMessage(
          `「${brand}」の写真を変更しました。商品データを保存してください。`
        );

      })
      .catch((error) => {

        console.error(error);

        alert(
          "画像の処理に失敗しました。"
        );

      });

  };


  reader.onerror = function() {

    alert(
      "画像の読み込みに失敗しました。"
    );

  };


  reader.readAsDataURL(file);

}


// ==============================
// 画像縮小・圧縮
// ==============================

function resizeImage(
  imageData,
  maxSize,
  quality
) {

  return new Promise(
    (resolve, reject) => {

      const image =
        new Image();


      image.onload = function() {

        let width =
          image.width;

        let height =
          image.height;


        /*
          長辺を maxSize px にする
        */

        if (
          width > maxSize ||
          height > maxSize
        ) {

          if (
            width >= height
          ) {

            height =
              Math.round(
                height *
                (maxSize / width)
              );

            width =
              maxSize;

          } else {

            width =
              Math.round(
                width *
                (maxSize / height)
              );

            height =
              maxSize;

          }

        }


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          width;

        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d"
          );


        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const result =
          canvas.toDataURL(
            "image/jpeg",
            quality
          );


        resolve(result);

      };


      image.onerror =
        reject;


      image.src =
        imageData;

    }
  );

}


// ==============================
// 商品追加
// ==============================

function addProduct() {

  products.unshift({

    code: "",

    size: "",

    a: "",

    price: "",

    brand: "",

    pattern: ""

  });


  renderProducts();


  showMessage(
    "新しい商品を追加しました。内容を入力してください。"
  );

}


// ==============================
// 商品削除
// ==============================

function deleteProduct(index) {

  const product =
    products[index];


  const code =
    product.code ||
    "この商品";


  if (
    !confirm(
      `${code} を削除しますか？`
    )
  ) {

    return;

  }


  products.splice(
    index,
    1
  );


  renderProducts();


  showMessage(
    "商品を削除しました。保存するまでDBには反映されません。"
  );

}


// ==============================
// ブランド写真保存
// ==============================

async function saveBrandImages() {

  /*
    今回変更したブランドだけ保存する
  */

  for (
    const brand of changedBrandImages
  ) {

    const imageData =
      brandImages[brand];


    if (
      !brand ||
      !imageData
    ) {

      continue;

    }


    const response =
      await fetch(
        "/api/brand-images",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              brand,

              imageData

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.message ||
        `ブランド「${brand}」の写真保存に失敗しました`
      );

    }

  }

}


// ==============================
// 商品データ保存
// ==============================

async function saveProducts() {

  if (
    !confirm(
      "現在の商品データとブランド写真を保存しますか？"
    )
  ) {

    return;

  }


  try {

    showMessage(
      "商品データを保存しています……"
    );


    /*
      まず商品データを保存
    */

    const response =
      await fetch(
        "/api/products",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              products
            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.message ||
        "商品データの保存に失敗しました"
      );

    }


    /*
      次にブランド写真を保存
    */

    showMessage(
      "ブランド写真を保存しています……"
    );


    await saveBrandImages();


    /*
      保存完了
    */

    changedBrandImages.clear();


    showMessage(
      "✅ 商品データとブランド写真を保存しました！"
    );


  } catch (error) {

    console.error(
      "商品データ保存エラー:",
      error
    );


    showMessage(
      "❌ 保存に失敗しました：" +
      error.message
    );

  }

}


// ==============================
// HTMLエスケープ
// ==============================

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==============================
// 初回読み込み
// ==============================

loadProducts();

</script>

</body>
</html>
